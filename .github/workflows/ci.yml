name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Pin npm
        # Newer npm (11.6.2+) has a lockfile-convergence bug (npm/cli#8726) that
        # spuriously fails `npm ci` on optional platform deps like fsevents,
        # even when the lockfile is otherwise correct. Pin to a known-good version.
        run: npm install -g npm@11.6.0

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test
